name: My First Workflow

on: push

jobs:
  first_job:
    needs: second_job
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: First job message
        run: echo "Hello from job 1"

      - name: List files
        run: ls

  second_job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Second job message
        run: echo "Hello from job 2"

      - name: Check current directory
        run: pwd
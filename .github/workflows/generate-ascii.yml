name: gen ascii workflow

on: push

jobs:
    ascii_job:
        runs-on: ubuntu-latest
        steps:
            - name: checkout repo
              uses: actions/checkout@v4

            - name: install cowsay program
              run: sudo apt-get install cowsay -y

            - name: execute cosay cmd
              run: cowsay -f dragon "run run runnnnnnnnn, i am a DRAGON... rawwrwrwwrwrr" >> dragon.txt

            - name: test file is there
              run: grep -i "dragon" dragon.txt

            - name: read file
              run: cat dragon.txt
            
            - name: list repo files
              run: ls -ltra
name: Artifact Practice

on: push

jobs:
  first_job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Create text file
        run: echo "Hello from job 1" > job1.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: job1-artifact
          path: job1.txt

  second_job:
    needs: first_job
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: job1-artifact
          path: job1.txt

      - name: Read file
        run: cat job1.txt